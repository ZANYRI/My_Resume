name: Update GitHub activity cache

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions
        run: |
          curl -sf "https://github-contributions-api.jogruber.de/v4/ZANYRI?y=all" -o public/content/github-activity.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/content/github-activity.json
          git diff --cached --quiet || git commit -m "chore: refresh GitHub activity cache"
          git push
